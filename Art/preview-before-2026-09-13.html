<!doctype html><meta charset="utf-8">
<!--
  Engraving page for Mod/About/Preview.png, per STYLE_RIMWORLD.md.

  Rasterised with headless Chrome at 896x504, so the glyphs are composed at final size and never
  resampled. The background is Preview-source.png at full resolution, scaled and cropped here
  rather than beforehand: starting from an already-reduced Preview.png would resample the picture
  twice.

    chrome --headless --disable-gpu --screenshot=Mod/About/Preview.png \
           --window-size=896,504 --hide-scrollbars Art/preview.html

  The source is 1374x1145, close to 6:5, so a third of its height has to go to reach 16:9. The
  crop is taken low rather than centred: the bottom strip is the empty bench and floor in front
  of the table, while the band above the tray carries the lamp and the settler at the stove.

  The veil is cream rather than the near-black the first 54 showcases used, and the ink is dark
  because of it: the colour is sampled from the wheat grain in the bowl, the one pale thing in
  the picture, and its luminance is far above the 0.18 line that chooses between the two inks.
  The text shadows are gone with the dark veil - a black shadow under a black letter lifts
  nothing and dirties the edge - and the rule is a burnt amber, the repository's #D68F2C being
  too close to the cream to be seen on it.

  The count is engraved: five biscuits is a number that cannot move. Fullzoon's mod stopped at
  1.0 and the five are named one by one in the defs, so nothing outside this repository can
  change it. See the rule in STYLE_RIMWORLD.md.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:896px; height:504px; overflow:hidden; background:#000; }
  .stage { position:relative; width:896px; height:504px;
           font-family:"Segoe UI",system-ui,sans-serif; }

  .shot { position:absolute; inset:0; width:896px; height:504px;
          object-fit:cover; object-position:50% 54%; }

  /* Repository standard: a wash from the top-left corner. It is flatter than the near-black veil
     the first 54 showcases used - see STYLE_RIMWORLD.md: a pale wash has to hold its strength
     across the whole text block, because what it fights is a dark picture rather than a bright
     one. It lands on the bare floor tiles left of the table, which is the calmest corner of
     the picture and the one the prompt reserved. */
  .veil { position:absolute; inset:0;
    background: radial-gradient(ellipse 900px 680px at top left, rgba(239,217,168,.94) 0%, rgba(239,217,168,.90) 45%, rgba(239,217,168,0) 100%); }

  .text { position:absolute; left:56px; top:86px; width:430px; }
  h1 { font-size:44px; line-height:1.06; font-weight:700; color:#17120E; letter-spacing:-.5px; }
  .rule { width:58px; height:3px; background:#8A5A18; margin:22px 0 20px; }
  p { font-size:21px; line-height:1.42; color:#3A2E22; }
</style>
<div class="stage">
  <img class="shot" src="Preview-source.png">
  <div class="veil"></div>
  <div class="text">
    <h1>Fullzoon's Cookies<br>Renew</h1>
    <div class="rule"></div>
    <p>A wheat crop, and five biscuits baked from it at the stove.</p>
  </div>
</div>
