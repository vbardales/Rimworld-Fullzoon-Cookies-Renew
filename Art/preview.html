<!doctype html><html lang="en"><meta charset="utf-8"><title>Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:896px;height:504px;overflow:hidden}.stage{position:relative;width:896px;height:504px;font-family:"Segoe UI",system-ui,sans-serif}.shot{position:absolute;inset:0;width:896px;height:504px;object-fit:cover;object-position:50% 54%}.veil{position:absolute;inset:0;background:radial-gradient(ellipse 900px 680px at top left,rgba(var(--veil-rgb),.94) 0%,rgba(var(--veil-rgb),.90) 45%,rgba(var(--veil-rgb),0) 100%)}.text{position:absolute;left:50px;top:54px;width:510px;color:var(--inkPrimary)}h1{font-size:46px;font-weight:600;line-height:1.1;letter-spacing:0}.suffix{font-size:.65em;color:var(--inkSecondary)}.tag{width:max-content;margin-top:8px;font-size:24px;font-weight:400;line-height:1.1;letter-spacing:.2px;color:var(--inkSecondary)}.rule{width:58px;height:3px;margin:20px 0 16px;background:var(--accent)}.summary{width:430px;font-size:21px;font-weight:400;line-height:1.45;color:var(--inkPrimary)}.badge{position:absolute;right:0;top:0;width:80px;height:80px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%)}.version{position:absolute;left:869px;top:27px;transform:translate(-50%,-50%) rotate(45deg);font-size:26px;font-weight:700;line-height:1;color:var(--badgeInk)}
</style>
<div class="stage"><img class="shot" src="Preview-source.png" alt=""><div class="veil"></div><div class="text"><h1><span class="prefix suffix">Fullzoon's</span> <span class="main-title">Cookies</span><br><span class="suffix">Renew</span></h1><p class="tag">(unofficial)</p><div class="rule"></div><p class="summary">A wheat crop, and five biscuits baked from it at the stove.</p></div><div class="badge"></div><div class="version">1.6</div></div>
<script>
// JSON is the sole palette source. Serve with render-preview.cjs.
window.previewReady=(async()=>{const p=await(await fetch('preview-palette.json')).json();for(const[k,v]of Object.entries(p))document.documentElement.style.setProperty('--'+k,v);document.documentElement.style.setProperty('--veil-rgb',p.veil.match(/[a-f\d]{2}/gi).map(v=>parseInt(v,16)).join(','));await document.fonts.ready;await document.querySelector('.shot').decode()})();
</script></html>
